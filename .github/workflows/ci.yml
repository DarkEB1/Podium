name: CI

# DH-1 / A-3 / SEC-3 / DX-4 — before this workflow existed there was no
# .github/ directory at all: the full test suite, the type-checker, the linter,
# the production build and the dependency audit only ever ran when a human
# remembered to run them.
#
# Every step below is a GATE. Nothing uses continue-on-error: a red job must
# mean "do not merge", or the workflow is decoration.

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Next.js and Supabase clients read these at build time. They are throwaway
  # values for a build that never contacts a real service — no secret is
  # required to run CI, so forks and Dependabot PRs work too.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: 20
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a
      # drifted package.json fails here rather than in production.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npx next build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This gate fails on ANY high or critical advisory, the same threshold as
      # `npm audit --audit-level=high`. Moderate and low advisories stay out of
      # scope. The one difference is AUDIT_ALLOW: a list of advisory IDs that
      # are individually reviewed and accepted below. Every ID must carry a
      # written reason. A new high or critical advisory in any other package
      # still turns this job red, and plain `npm audit` no longer supports
      # per-advisory exceptions, which is why the check is scripted here.
      #
      # Accepted advisories:
      #   GHSA-mh99-v99m-4gvg  brace-expansion <=5.0.7, denial of service via
      #     unbounded brace expansion (out-of-memory crash). Fixed only in
      #     brace-expansion 5.0.8, whose module export changed from a function
      #     to an object. minimatch 3 (via eslint 9) and minimatch 9 (via glob)
      #     call the old function export, so 5.0.8 breaks `next lint`; forcing
      #     minimatch to 10 instead breaks eslint 9, which imports minimatch's
      #     default export. No forward-compatible resolution exists today, and
      #     npm's own fix downgrades eslint to a breaking major. This package is
      #     reached only by lint, test and coverage tooling expanding the repo's
      #     own glob patterns, never runtime code or attacker input. Drop this
      #     entry once eslint's dependency chain ships a minimatch that consumes
      #     brace-expansion 5.x.
      - name: npm audit (fails on high or critical)
        env:
          AUDIT_ALLOW: GHSA-mh99-v99m-4gvg
        run: |
          set -uo pipefail
          # npm audit exits non-zero when advisories exist; the node script,
          # not npm's exit code, decides whether this job passes.
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("fs");
            const allow = new Set((process.env.AUDIT_ALLOW || "").split(/\s+/).filter(Boolean));
            const vulns = JSON.parse(fs.readFileSync("npm-audit.json", "utf8")).vulnerabilities || {};
            const found = new Map();
            for (const name of Object.keys(vulns)) {
              for (const a of vulns[name].via || []) {
                if (typeof a !== "object") continue;
                if (a.severity !== "high" && a.severity !== "critical") continue;
                const id = (a.url || "").split("/").pop();
                found.set(id, a.severity.toUpperCase() + " " + name + ": " + a.title + " (" + a.url + ")");
              }
            }
            const blocking = [...found].filter(([id]) => !allow.has(id));
            if (blocking.length) {
              console.error("High or critical advisories outside the allowlist:");
              for (const [, d] of blocking) console.error("  - " + d);
              process.exit(1);
            }
            const ignored = [...found].filter(([id]) => allow.has(id)).map(([id]) => id);
            console.log(ignored.length
              ? "No blocking advisories. Accepted (see ci.yml): " + ignored.join(", ") + "."
              : "No high or critical advisories.");
          '

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2
        with:
          # Full history so a secret committed earlier and later "removed" is
          # still caught — git never forgets, and neither should the scanner.
          fetch-depth: 0

      # SEC-3. Zero third-party actions by design: gitleaks would need either a
      # marketplace action (supply-chain surface in a job with repo contents) or
      # a licence key for org repos. The pinned release binary gives the same
      # detection with a checksum-able artefact and no action trust.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan history for committed secrets
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1

      # Belt and braces, and the fallback if the download above ever breaks:
      # a grep for the exact credential shapes this project uses. `.env.local`
      # is gitignored; this catches the day someone force-adds it. The
      # SUPABASE_SERVICE_ROLE_KEY clause requires a JWT value (eyJ...), which is
      # the shape of a real service role key, so it fires on a leaked key while
      # ignoring the placeholder assignments that setup docs legitimately show.
      - name: Grep for project-specific credential shapes
        run: |
          set -euo pipefail
          PATTERNS='(sk_live_[0-9a-zA-Z]{16,}|rk_live_[0-9a-zA-Z]{16,}|whsec_[0-9a-zA-Z]{16,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*eyJ|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9)'
          if git grep -nIE "$PATTERNS" -- \
              ':!*.test.ts' ':!*.test.tsx' ':!.env.local.example' ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string is committed to the repository. Rotate it, then remove it from history."
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Assert .env.local is not tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env.local >/dev/null 2>&1; then
            echo "::error::.env.local is tracked by git. It must stay ignored."
            exit 1
          fi
          echo ".env.local is not tracked."
